name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy backend
        shell: bash
        run: |
          set -e

          cd /www/wwwroot/aran-backend

          echo "=== Git configuration ==="

          git remote set-url origin git@github.com-aran-backend:hariharan152578/aran-backend.git

          echo "=== Testing GitHub SSH ==="

          ssh -T git@github.com-aran-backend || true

          echo "=== Updating source ==="

          git fetch origin main
          git reset --hard origin/main

          echo "=== Installing dependencies ==="

          export PATH="/www/server/nodejs/v26.8.2/bin:$PATH"

          npm ci

          echo "=== Restarting PM2 ==="

          sudo -n -u www /www/server/nodejs/v26.8.2/bin/pm2 restart src

          echo "=== PM2 status ==="

          sudo -n -u www /www/server/nodejs/v26.8.2/bin/pm2 list

          echo "=== Deployment completed ==="